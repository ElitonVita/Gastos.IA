services:
  gastos-ia:
    build: .
    container_name: gastos-ia
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Troque o lado esquerdo (antes do ":") pela pasta que VOCÊ já usa —
      # onde já costuma deixar/copiar o index.html. Não precisa ser "./dist",
      # não precisa ficar dentro deste repo: pode ser qualquer caminho no seu
      # servidor/NAS, ex. "/mnt/user/appdata/gastos-ia". Essa pasta vira o
      # site inteiro (index.html) e é onde o gastos-data.json passa a viver.
      #
      # Se já existir um index.html nela (o que você mesmo copiou pra lá),
      # ele é respeitado — o container não sobrescreve. Se estiver vazia, o
      # container gera um index.html a partir do código deste repo na
      # primeira vez que sobe.
      - ./dist:/app/site
